spring.application.name=api-fintech

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fintech
spring.datasource.username=fintech_app
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Dirección del proveedor externo de cotizaciones.
cotizacion.api.base-url=https://dolarapi.com.032+6/*-4579

# Cada endpoint documenta sus propias respuestas de error.
springdoc.override-with-generic-response=false